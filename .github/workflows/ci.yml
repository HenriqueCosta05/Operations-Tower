name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
        env:
          CI: "true"
      - run: npm run test:integration --if-present
        env:
          CI: "true"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Format and static checks
        run: ./mvnw -B -ntp spotless:check enforcer:enforce
      - name: Unit and integration tests with coverage gate
        run: ./mvnw -B -ntp verify -Dgroups='!e2e'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-reports
          path: |
            server/target/surefire-reports
            server/target/failsafe-reports
            server/target/site/jacoco
          retention-days: 7

  e2e:
    needs: [client, server]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: npm ci
        working-directory: client
      - name: Server end-to-end tests
        working-directory: server
        run: ./mvnw -B -ntp verify -Dgroups=e2e -Djacoco.skip=true
      - name: Client end-to-end tests
        working-directory: client
        run: npm run test:e2e --if-present
        env:
          CI: "true"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
