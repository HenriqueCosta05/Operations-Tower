version: 1
metadata:
  name: Operations Tower
entries:
  - model: authentik_core.group
    id: operators-group
    identifiers:
      name: operators
  - model: authentik_core.group
    id: admins-group
    identifiers:
      name: admins
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: Operations Tower
    attrs:
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: operations-tower
      issuer_mode: per_provider
      grant_types:
        - authorization_code
        - refresh_token
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/auth/callback", !Env [APP_URL, "http://localhost:4200"]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
  - model: authentik_core.application
    identifiers:
      slug: operations-tower
    attrs:
      name: Operations Tower
      provider: !KeyOf provider
